
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Italian Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Italian Practice</h1>
      <p>日本語からイタリア語を組み立てる練習</p>
    </header>

    <section class="toolbar">
      <div class="filter-group">
        <label for="categoryFilter">文法カテゴリ</label>
        <select id="categoryFilter">
          <option value="all">すべて</option>
        </select>
      </div>

      <button id="toggleAnswers" type="button">
        解答を表示
      </button>
    </section>

    <section class="summary" aria-live="polite">
      <span id="questionCount">表示：0問</span>
      <span id="completionCount">完了：0 / 0問</span>
    </section>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>No.</th>
            <th>日本語</th>
            <th>イタリア語・解説</th>
            <th>音声</th>
            <th>完了</th>
          </tr>
        </thead>
        <tbody id="questionTableBody">
          <tr>
            <td colspan="5">読み込み中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="help-text">
      イタリア語の文にマウスを乗せるか、タップすると、
      文法・単語・英語との対応を確認できます。
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
